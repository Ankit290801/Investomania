spring:
  datasource:
    url: jdbc:h2:file:./data/investmentdb;NON_KEYWORDS=VALUE,TYPE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    # show-sql/format_sql removed (E1): SQL logging is owned by
    # logback-spring.xml — `org.hibernate.SQL` at DEBUG in the dev profile.
