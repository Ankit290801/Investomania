business-rules:
  investments:
    equity:
      min-quantity: 1
      max-quantity: 1000000
      markets:
        - NSE
        - BSE
        - NYSE
        - NASDAQ
    
    fixed-deposit:
      min-amount: 1000
      max-tenure-months: 120
      min-interest-rate: 0.01
      max-interest-rate: 0.15
    
    recurring-deposit:
      min-monthly-contribution: 100
      max-tenure-months: 120
  
  expenses:
    categories:
      - HOUSING
      - FOOD
      - TRANSPORT
      - HEALTHCARE
      - ENTERTAINMENT
      - EDUCATION
      - UTILITIES
      - INSURANCE
      - OTHER
    
    mapping:
      min-percentage: 0.01
      max-percentage: 100
      total-must-equal: 100

  # Excel expense import (backlog feature F2). Read by ExpenseImportRules —
  # the single config accessor for this file.
  expense-import:
    # Maximum accepted rows per uploaded sheet.
    max-rows: 5000
    # Currency applied when a row omits one.
    default-currency: INR
    # Category applied when no keyword matches the description. Must be one
    # of the categories listed above.
    default-category: OTHER
    # Category inference: first keyword found (case-insensitive substring of
    # the description) wins, in this order.
    category-keywords:
      HOUSING:
        - rent
        - mortgage
        - maintenance
        - society
      FOOD:
        - grocery
        - groceries
        - restaurant
        - supermarket
        - swiggy
        - zomato
        - dominos
      TRANSPORT:
        - fuel
        - petrol
        - diesel
        - uber
        - ola
        - metro
        - parking
        - toll
      HEALTHCARE:
        - pharmacy
        - hospital
        - clinic
        - doctor
        - medicine
        - apollo
      ENTERTAINMENT:
        - netflix
        - cinema
        - movie
        - concert
        - spotify
      EDUCATION:
        - tuition
        - school
        - college
        - course
        - udemy
        - books
      UTILITIES:
        - electricity
        - water bill
        - gas
        - broadband
        - internet
        - mobile recharge
        - airtel
        - jio
      INSURANCE:
        - insurance
        - premium
        - policy
  
  analytics:
    dashboard:
      default-date-range-days: 365
      max-date-range-days: 3650  # 10 years
    
    segments:
      equity:
        - EQUITY
      safe-assets:
        - FD
        - RD
        - BOND
        - PPF
      illiquid-assets:
        - REAL_ESTATE
        - NPS
