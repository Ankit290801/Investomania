spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investmentdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    # show-sql removed (E1): logging is owned by logback-spring.xml.

# E1: no logging.level.* here — logback-spring.xml owns all log levels.
